        const MIN_SIZE = 8; // Tamaño mínimo del círculo antes de dejar de dividirse
        
        /* ==================================================================== */

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const loadingDiv = document.getElementById('loading');
        
        let circles = [];
        let hiddenCanvas = document.createElement('canvas');
        let hiddenCtx = hiddenCanvas.getContext('2d', { willReadFrequently: true });
        
        // Calcular tamaño del área de juego (cuadrado perfecto)
        const gameSize = Math.min(window.innerWidth, window.innerHeight) * 0.9;
        canvas.width = gameSize;
        canvas.height = gameSize;
        hiddenCanvas.width = gameSize;
        hiddenCanvas.height = gameSize;

        // Cargar imagen
        const img = new Image();
        img.crossOrigin = "Anonymous"; // Necesario si usas URLs externas para evitar bloqueos CORS
        img.src = IMAGE_SRC;

        img.onload = () => {
            loadingDiv.style.display = 'none';
            // Dibujar la imagen en un canvas oculto para extraer sus colores
            hiddenCtx.drawImage(img, 0, 0, gameSize, gameSize);
            
            // Iniciar con un círculo gigante
            const initialColor = getAverageColor(0, 0, gameSize, gameSize);
            circles.push(new Circle(0, 0, gameSize, initialColor));
            
            // Iniciar el bucle de renderizado (animación)
            requestAnimationFrame(animate);
        };

        // Extraer el color promedio de un cuadrante
        function getAverageColor(x, y, w, h) {
            const imgData = hiddenCtx.getImageData(x, y, w, h).data;
            let r = 0, g = 0, b = 0, count = 0;
            
            // Saltamos píxeles para optimizar rendimiento (step)
            const step = Math.ceil((w * h) / 1000) * 4; 
            for (let i = 0; i < imgData.length; i += step) {
                r += imgData[i];
                g += imgData[i + 1];
                b += imgData[i + 2];
                count++;
            }
            return `rgb(${~~(r / count)}, ${~~(g / count)}, ${~~(b / count)})`;
        }

        // Clase Círculo
        class Circle {
            constructor(x, y, size, color) {
                this.x = x;
                this.y = y;
                this.size = size;
                this.color = color;
                this.currentRadius = 0; // Empieza en 0 para animar el crecimiento
                this.targetRadius = size / 2;
            }

            draw(ctx) {
                // Animación suave de crecimiento
                if (this.currentRadius < this.targetRadius) {
                    this.currentRadius += (this.targetRadius - this.currentRadius) * 0.2;
                }

                ctx.beginPath();
                // 0.95 para dejar un pequeño margen (gap) entre círculos
                ctx.arc(this.x + this.size / 2, this.y + this.size / 2, this.currentRadius * 0.95, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
            }

            contains(mx, my) {
                const dx = (this.x + this.size / 2) - mx;
                const dy = (this.y + this.size / 2) - my;
                return (dx * dx + dy * dy) < (this.targetRadius * this.targetRadius);
            }
        }

// Función centralizada para detectar la posición (sirve para PC y móviles)
        function interactuar(clientX, clientY) {
            const rect = canvas.getBoundingClientRect();
            const x = clientX - rect.left;
            const y = clientY - rect.top;

            for (let i = circles.length - 1; i >= 0; i--) {
                let c = circles[i];
                if (c.contains(x, y) && c.size > MIN_SIZE) {
                    circles.splice(i, 1);
                    const newSize = c.size / 2;
                    
                    const tlColor = getAverageColor(c.x, c.y, newSize, newSize);
                    const trColor = getAverageColor(c.x + newSize, c.y, newSize, newSize);
                    const blColor = getAverageColor(c.x, c.y + newSize, newSize, newSize);
                    const brColor = getAverageColor(c.x + newSize, c.y + newSize, newSize, newSize);

                    circles.push(new Circle(c.x, c.y, newSize, tlColor));
                    circles.push(new Circle(c.x + newSize, c.y, newSize, trColor));
                    circles.push(new Circle(c.x, c.y + newSize, newSize, blColor));
                    circles.push(new Circle(c.x + newSize, c.y + newSize, newSize, brColor));
                    break; 
                }
            }
        }

        // 1. Interacción con ratón (PC)
        canvas.addEventListener('mousemove', (e) => {
            interactuar(e.clientX, e.clientY);
        });

        // 2. Interacción al deslizar el dedo (Móvil/Tablet)
        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault(); // Evita que la pantalla haga scroll al arrastrar el dedo
            interactuar(e.touches[0].clientX, e.touches[0].clientY);
        }, { passive: false });

        // 3. Interacción con un toque rápido (Móvil/Tablet) 
        canvas.addEventListener('touchstart', (e) => {
            interactuar(e.touches[0].clientX, e.touches[0].clientY);
        }, { passive: true });

        // Bucle de animación para el canvas
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < circles.length; i++) {
                circles[i].draw(ctx);
            }
            requestAnimationFrame(animate);
        }
    </script>
